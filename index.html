<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Outfit:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.css"
        integrity="sha512-GmZYQ9SKTnOea030Tbiat0Y+jhnYLIpsGAe6QTnToi8hI2nNbVMETHeK4wm4MuYMQdrc38x+sX77+kVD01eNsQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
    <div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
        <form id="login-form" class="card w-full max-w-md bg-base-100 shadow-xl p-8 rounded-2xl border border-gray-100">

            <div class="flex flex-col items-center mb-6">
                <img src="./assets/github-logo.png" alt="GitHub-Logo" class="mb-4">
                <h2 class="text-2xl font-bold text-gray-900">GitHub Issues Tracker</h2>
                <p class="text-gray-500 text-sm mt-1">Sign in to manage your issues</p>
            </div>

            <p id="error-message" class="text-red-500 text-sm mb-3 hidden text-center"></p>

            <fieldset class="fieldset p-0 space-y-4">

                <div>
                    <label class="label font-semibold text-gray-700 mb-1">Username</label>
                    <input type="text" id="username"
                        class="input input-bordered w-full focus:outline-none focus:border-indigo-600 rounded-lg"
                        placeholder="Enter Username" required />
                    <span class="text-xs text-indigo-600 font-medium mt-1 block">Default: admin</span>
                </div>

                <div>
                    <label class="label font-semibold text-gray-700 mb-1">Password</label>
                
                    <div class="relative">
                        <input type="password" id="password"
                            class="input input-bordered w-full pr-10 focus:outline-none focus:border-indigo-600 rounded-lg"
                            placeholder="Enter Password" required />
                
                        <button type="button" id="toggle-password"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 cursor-pointer">
                            <i id="eye-icon" class="fa-regular fa-eye-slash text-xs"></i>
                        </button>
                    </div>
                
                    <span class="text-xs text-indigo-600 font-medium mt-1 block">Default: admin123</span>
                </div>

                <button type="submit" id="login-btn"
                    class="btn bg-indigo-600 hover:bg-indigo-700 text-white w-full rounded-lg text-base font-semibold border-none mt-2">
                    Sign In
                </button>

            </fieldset>

            <div class="divider text-xs text-gray-400 font-medium my-6">OR</div>

            <div class="bg-slate-50 border border-slate-100 p-4 rounded-xl text-center">
                <p class="text-xs text-gray-500 mb-2">Demo Credentials:</p>
                <p class="text-sm text-gray-700">
                    <span class="font-bold">Username:</span> admin
                </p>
                <p class="text-sm text-gray-700">
                    <span class="font-bold">Password:</span> admin123
                </p>
            </div>

        </form>
    </div>
    <script src="./login.js"></script>
</body>
</html>
